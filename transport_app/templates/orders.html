{% extends 'base.html' %}

{% block title %}Замовлення{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Управління замовленнями</h1>
</div>

<div class="section">
    <form action="{{ url_for('add_order') }}" method="POST">
        <div class="form-group">
            <label>Клієнт</label>
            <select name="customer_id">
                <option value="" selected></option>
                {% for c in customers %}
                <option value="{{ c[0] }}">{{ c[1] }}</option>
                {% endfor %}
            </select>

        </div>
        <div class="form-group">
            <label>Транспорт</label>
            <select name="vehicle_id">
                <option value="" selected></option>
                {% for v in vehicles %}
                <option value="{{ v[0] }}">{{ v[1] }}</option>
                {% endfor %}
            </select>

        </div>
        <div class="form-group">
            <label>Маршрут</label>
            <select name="route_id">
                <option value="" selected></option>
                {% for r in routes %}
                <option value="{{ r[0] }}">{{ r[1] }} → {{ r[2] }}</option>
                {% endfor %}
            </select>

        </div>
        <button type="submit" class="btn btn-primary">Створити замовлення</button>
    </form>
</div>

<div class="section">
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Клієнт</th>
                    <th>Авто</th>
                    <th>Маршрут</th>
                    <th>Статус</th>
                    <th>Дата</th>
                    <th>Дії</th>
                </tr>
            </thead>
            <tbody>
                {% for o in orders %}
                <tr>
                    <td>#{{ o[0] }}</td>
                    <td>{{ o[1] }}</td>
                    <td>{{ o[2] }}</td>
                    <td>{{ o[3] }} → {{ o[4] }}</td>
                    <td>
                        <form action="{{ url_for('update_order', order_id=o[0]) }}" method="POST" class="inline-form">
                            <select name="status" class="status-select">
                                <option value="нове" {% if o[5]=='нове' %}selected{% endif %}>нове</option>
                                <option value="в дорозі" {% if o[5]=='в дорозі' %}selected{% endif %}>в дорозі</option>
                                <option value="завершено" {% if o[5]=='завершено' %}selected{% endif %}>завершено</option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-primary">Оновити</button>
                        </form>
                    </td>
                    <td>{{ o[6] }}</td>
                    <td class="action-buttons">
                        <a href="{{ url_for('delete_order', order_id=o[0]) }}" class="btn btn-sm btn-danger">Видалити</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
