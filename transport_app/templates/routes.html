{% extends 'base.html' %}

{% block title %}Маршрути{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Управління маршрутами</h1>
</div>

<div class="section">
    <form action="{{ url_for('add_route') }}" method="POST">
        <div class="form-group">
            <label>Початок</label>
            <input type="text" name="start_location" required>
        </div>
        <div class="form-group">
            <label>Кінець</label>
            <input type="text" name="end_location" required>
        </div>
        <div class="form-group">
            <label>Відстань (км)</label>
            <input type="number" step="0.01" name="distance_km" required>
        </div>
        <button type="submit" class="btn btn-primary">Додати маршрут</button>
    </form>
</div>

<div class="section">
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr><th>Початок</th><th>Кінець</th><th>Відстань</th><th>Замовлень</th><th>Дії</th></tr>
            </thead>
            <tbody>
                {% for r in routes %}
                <tr>
                    <td>{{ r[1] }}</td>
                    <td>{{ r[2] }}</td>
                    <td>{{ r[3] }} км</td>
                    <td>{{ r[4] }}</td>
                    <td class="action-buttons">
                        <a href="{{ url_for('delete_route', route_id=r[0]) }}" class="btn btn-sm btn-danger">Видалити</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
