{% extends 'base.html' %}

{% block title %}Транспорт{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Управління транспортом</h1>
</div>

<div class="section">
    <form action="{{ url_for('add_vehicle') }}" method="POST">
        <div class="form-group">
            <label>Номер авто</label>
            <input type="text" name="plate_number" required>
        </div>
        <div class="form-group">
            <label>Вантажопідйомність</label>
            <input type="number" name="capacity" required>
        </div>
        <div class="form-group">
            <label>Водій</label>
            <select name="driver_id">
                {% for d in drivers %}
                <option value="{{ d[0] }}">{{ d[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Додати транспорт</button>
    </form>
</div>

<div class="section">
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr><th>Номер</th><th>Вантажопідйомність</th><th>Водій</th><th>Дії</th></tr>
            </thead>
            <tbody>
                {% for v in vehicles %}
                <tr>
                    <td>{{ v[1] }}</td>
                    <td>{{ v[2] }}</td>
                    <td>{{ v[3] }}</td>
                    <td class="action-buttons">
                        <a href="{{ url_for('delete_vehicle', vehicle_id=v[0]) }}" class="btn btn-sm btn-danger">Видалити</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
