{% extends 'base.html' %}

{% block title %}Водії{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Управління водіями</h1>
</div>

<div class="section">
    <form action="{{ url_for('add_driver') }}" method="POST">
        <div class="form-group">
            <label>Ім’я</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Номер ліцензії</label>
            <input type="text" name="license_number" required>
        </div>
        <button type="submit" class="btn btn-primary">Додати водія</button>
    </form>
</div>

<div class="section">
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr><th>Ім’я</th><th>Ліцензія</th><th>Авто</th><th>Дії</th></tr>
            </thead>
            <tbody>
                {% for d in drivers %}
                <tr>
                    <td>{{ d[1] }}</td>
                    <td>{{ d[2] }}</td>
                    <td>{{ d[3] }}</td>
                    <td class="action-buttons">
                        <a href="{{ url_for('delete_driver', driver_id=d[0]) }}" class="btn btn-sm btn-danger">Видалити</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
